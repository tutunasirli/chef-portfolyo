<style>
  .gallery-section{padding:5rem 0 7rem;background:var(--dark)}
  .filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:3rem}
  .filter-btn{font:400 .75rem 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(184,150,74,.25);padding:.55rem 1.3rem;background:transparent;color:var(--muted);cursor:pointer;transition:all .3s}
  .filter-btn:hover,.filter-btn.active{border-color:var(--gold);color:var(--gold)}
  .filter-btn.active{background:rgba(184,150,74,.08)}

  .gallery-masonry{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .gallery-card{display:block;width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;border:0;padding:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .gallery-card[hidden]{display:none}
  .card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.25,.46,.45,.94),filter .6s;filter:brightness(.85) saturate(.95)}
  .gallery-card:hover .card-img,.gallery-card:focus-visible .card-img{transform:scale(1.05);filter:none}
  .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,26,24,.92) 0%,transparent 55%);opacity:0;transition:opacity .4s;display:flex;flex-direction:column;justify-content:flex-end;padding:1.5rem}
  .gallery-card:hover .card-overlay,.gallery-card:focus-visible .card-overlay{opacity:1}
  .card-title{font:italic 1.15rem 'Cormorant Garamond',serif;color:var(--cream);margin-bottom:.3rem}
  .card-cat{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  @media (hover:none){.card-overlay{opacity:1}}

  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(13,13,11,.96);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
  .lightbox:not(.open){visibility:hidden}
  .lightbox.open{opacity:1;pointer-events:all}
  .lightbox-close{position:absolute;top:2rem;right:2.5rem;font:400 .78rem 'Montserrat',sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;transition:color .3s}
  .lightbox-close:hover{color:var(--gold)}
  .lightbox-content{text-align:center;max-width:92vw}
  .lightbox-img{margin:0 auto 1.5rem}
  .lightbox-img img{max-width:90vw;max-height:72vh;width:auto;height:auto;border:1px solid rgba(184,150,74,.2);object-fit:contain}
  .lightbox-title{font:italic 1.8rem 'Cormorant Garamond',serif;color:var(--cream);margin-bottom:.4rem}
  .lightbox-cat{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}

  @media (max-width:900px){.gallery-masonry{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:500px){.gallery-masonry{grid-template-columns:1fr}}
