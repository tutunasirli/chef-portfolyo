<link rel="stylesheet" href="css/style.css">
<style>
  .contact-section { padding: 6rem 0 8rem; background: var(--dark); }

  .contact-grid {
    display: grid; grid-template-columns: 1fr 1.4fr;
    gap: 6rem; align-items: start; margin-top: 3rem;
  }

  /* Sol — bilgiler */
  .contact-info-block { display: flex; flex-direction: column; }
  .info-item {
    display: flex; align-items: flex-start; gap: 1.5rem;
    padding: 2rem 0; border-bottom: 1px solid rgba(184,150,74,0.1);
  }
  .info-item:first-child { padding-top: 0; }
  .info-icon {
    width: 2.8rem; height: 2.8rem; flex-shrink: 0;
    border: 1px solid rgba(184,150,74,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .info-label {
    font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.3rem;
  }
  .info-value { font-size: 0.85rem; color: var(--cream); line-height: 1.5; }
  .info-value a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(184,150,74,0.3); }
  .info-value a:hover { color: var(--gold); }
  .info-note { color: var(--muted); font-size: 0.85rem; }

  /* Sağ — form */
  .contact-form { display: flex; flex-direction: column; gap: 1.5rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .form-label {
    font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
  }
  .form-input, .form-textarea {
    background: transparent;
    border: none; border-bottom: 1px solid rgba(184,150,74,0.25);
    color: var(--cream); font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem; padding: 0.8rem 0; outline: none;
    transition: border-color 0.3s; width: 100%;
  }
  .form-input:focus, .form-textarea:focus { border-bottom-color: var(--gold); }
  .form-textarea { resize: none; height: 120px; }
  .honeypot { display: none; }

  .form-submit {
    align-self: flex-start; margin-top: 0.5rem;
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); font-family: 'Montserrat', sans-serif;
    font-size: 0.78rem; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 1rem 2.5rem; cursor: pointer; transition: all 0.4s;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .form-submit:hover { background: var(--gold); color: var(--dark); }
  .form-submit:disabled { opacity: 0.6; cursor: wait; }
  .submit-arrow { transition: transform 0.3s; }
  .form-submit:hover .submit-arrow { transform: translateX(6px); }

  /* Başarı mesajı */
  .success-msg {
    display: none; padding: 1.5rem 2rem;
    border: 1px solid rgba(76,175,80,0.3);
    background: rgba(76,175,80,0.05);
    color: #6dbf70; font-size: 0.8rem; line-height: 1.6;
  }

  /* Hata mesajı */
  .form-error {
    display: none; padding: 1.5rem 2rem;
    border: 1px solid rgba(220,80,80,0.3);
    background: rgba(220,80,80,0.05);
    color: #e07a7a; font-size: 0.8rem; line-height: 1.6;
  }

  @media (max-width: 900px) {
    .contact-grid { grid-template-columns: 1fr; gap: 3rem; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
